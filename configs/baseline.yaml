experiment_name: "baseline"

chunker:
  type: "recursive"
  chunk_size: 512
  overlap: 50

embedding:
  type: "huggingface"
  model_name: "sentence-transformers/all-MiniLM-L6-v2"

retriever:
  type: "naive"
  top_k: 5
  collection_name: "nutrition_docs"

reranker:
  type: "none"
  model_name: ""
  top_k: 5

llm:
  type: "ollama"
  model_name: "llama3.1:8b"
  temperature: 0.1
  max_tokens: 256
  # system_prompt and context_template are now configurable for A/B testing
  # system_prompt: null  # Uses default if not set
  # context_template: null  # Uses default "[Fonte {i}]: {content}" if not set
