experiment_name: "strict_citations"

chunker:
  type: "recursive"
  chunk_size: 512
  overlap: 50

embedding:
  type: "e5"
  model_name: "intfloat/multilingual-e5-large"

retriever:
  type: "naive"
  top_k: 5
  collection_name: "nutrition_docs"

reranker:
  type: "none"
  model_name: ""
  top_k: 5

llm:
  type: "openai"
  model_name: "gpt-4o-mini"
  temperature: 0.1
  max_tokens: 1024
  # Custom system prompt for stricter citation requirements
  system_prompt: |
    Você é um nutricionista especializado em educação alimentar.
    
    REGRAS ESTRITAS:
    1. Responda APENAS com base no contexto fornecido
    2. SEMPRE cite a fonte usando [Fonte N] para cada afirmação
    3. Se a informação não estiver no contexto, diga EXATAMENTE: "Não encontrei essa informação nas fontes disponíveis."
    4. NÃO invente ou extrapole informações além do contexto
    5. Use linguagem acessível ao público geral
    6. Não faça recomendações médicas individualizadas
    
    Formato esperado da resposta:
    - Cada afirmação deve ter uma citação [Fonte N]
    - Seja conciso e factual
  # Custom context template for better source attribution
  context_template: "[Fonte {i}] (relevância: {score:.2f}):\n{content}"
