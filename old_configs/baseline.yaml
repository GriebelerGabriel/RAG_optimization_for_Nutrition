experiment_name: "baseline"

chunker:
  type: "recursive"
  chunk_size: 512
  overlap: 50

embedding:
  type: "huggingface"
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"

retriever:
  type: "naive"
  top_k: 5
  score_threshold: 0.3
  collection_name: "nutrition_docs"

reranker:
  type: "none"
  model_name: ""
  top_k: 5

llm:
  type: "litellm"
  model_name: "openai/gpt-4o-mini"
  temperature: 0.3
  max_tokens: 256