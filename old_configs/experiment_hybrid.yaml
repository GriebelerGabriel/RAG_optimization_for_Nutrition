experiment_name: "hybrid_retrieval"

chunker:
  type: "recursive"
  chunk_size: 512
  overlap: 50

embedding:
  type: "e5"
  model_name: "intfloat/multilingual-e5-base"

retriever:
  type: "hybrid"
  top_k: 5
  score_threshold: 0.3
  collection_name: "nutrition_docs"

reranker:
  type: "cross_encoder"
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

llm:
  type: "litellm"
  model_name: "openai/gpt-4o-mini"
  temperature: 0.1
  max_tokens: 1024
