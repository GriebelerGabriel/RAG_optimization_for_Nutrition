[tool.poetry]
name = "rag-nutrition"
version = "0.1.0"
description = "RAG system for nutritional education - exploration and benchmarking"
authors = ["Gabriel Griebeler"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
langchain = "^0.3"
langchain-community = "^0.3"
langchain-openai = "^0.2"
chromadb = "^0.5"
sentence-transformers = "^3.0"
openai = "^1.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
pyyaml = "^6.0"
pymupdf = "^1.24"
unstructured = {extras = ["pdf"], version = "^0.15"}
rank-bm25 = "^0.2"
ragas = "^0.2"
streamlit = "^1.40"
pandas = "^2.0"
numpy = "^1.26"
python-dotenv = "^1.0"
tiktoken = "^0.7"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ipykernel = "^6.0"
jupyter = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
